name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Full offline verification (same entrypoint as just verify)
        run: uv run --locked --extra dev python -m engram.tooling.verify verify
      - name: Temporary local Git transport integration
        run: uv run --locked --extra dev python -m engram.tooling.verify sync-transport
