[project]
name = "engram"
version = "0.1.0"
description = "Engram — structured, cross-project memory for coding agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp==4.0.0b2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "textual>=1.0.0",
    "textual-plotext>=1.0.0",
    "snowballstemmer>=3.1.1",
    "openai>=1.60",
]

[project.scripts]
engram = "engram.cli:main_dispatch"
engram-dash = "engram.dashboard.app:main"

[project.optional-dependencies]
dev = [
    "hatchling>=1.33.0",
    "basedpyright==1.40.2",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.17.4",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live_provider and not sync_transport'"

[tool.basedpyright]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.14"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
extraPaths = ["src", "."]
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = false
reportPrivateUsage = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "PGH003", "TID251"]
ignore = [
    # ruff format wraps code; the remaining long lines are user-facing strings and prompts.
    "E501",
    # (str, Enum) keeps str(member) == "Class.member"; StrEnum would change it.
    "UP042",
]

# A TID251 ignore lifts every ban below for that file, so owners stay one file each.
# subprocess is not banned (exception dated 2026-11-07): git sync, project detection,
# doctor, eval reports, and the tooling lanes all run git or child processes, so the
# owner list would cover 15 files and lift the network and SDK bans for all of them.
[tool.ruff.lint.per-file-ignores]
"src/engram/llm/client.py" = ["TID251"]
"src/engram/tooling/smoke.py" = ["TID251"]
"tests/test_llm.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"openai".msg = "Call the provider through engram.llm.client."
"httpx".msg = "Network calls belong to engram.llm.client."
"httpx2".msg = "Network calls belong to engram.llm.client."
"requests".msg = "Network calls belong to engram.llm.client."
"urllib.request".msg = "Network calls belong to engram.llm.client."
"http.client".msg = "Network calls belong to engram.llm.client."
"socket".msg = "Only engram.tooling.smoke opens sockets."
