[project]
name = "engram"
version = "0.1.0"
description = "Engram — structured, cross-project memory for coding agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp==4.0.0b2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "textual>=1.0.0",
    "textual-plotext>=1.0.0",
    "snowballstemmer>=3.1.1",
    "openai>=1.60",
]

[project.scripts]
engram = "engram.cli:main_dispatch"
engram-dash = "engram.dashboard.app:main"

[project.optional-dependencies]
dev = [
    "hatchling>=1.33.0",
    "mypy>=2.2.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.0",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live_provider and not sync_transport'"

[tool.mypy]
python_version = "3.13"
files = ["src/engram"]
strict = true
